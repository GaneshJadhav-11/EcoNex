<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create E-Waste Lot</title>

<link rel="stylesheet"
      href="css/style.css">

</head>


<body class="app-page form-page">

<div class="page">
<div class="header app-header"><div><a class="brand brand--small" href="collector.html"><span class="brand-mark">E</span><span>EcoNex</span></a><p>New collection • नया कलेक्शन</p></div><button class="quiet-btn" onclick="location.href='collector.html'">← Dashboard</button></div>
<div class="card form-card">

<span class="section-kicker">STEP 1 OF 1</span><h1>Create a new lot</h1>
<p class="form-intro">Add only the details you know. You can complete this offline and sync later.</p>

<div class="photo-drop" onclick="triggerImagePicker()" style="cursor: pointer;">
    <span>📷</span>
    <div>
        <strong>Photograph the e-waste</strong>
        <small>A clear photo helps with the estimate</small>
    </div>
    <input type="file" id="photo" accept="image/*" capture="environment" aria-label="Upload e-waste photo" style="display: none;">
</div>
<div class="image-preview" id="imagePreview" hidden><img id="previewImage" alt="Selected e-waste preview"><button type="button" class="quiet-btn" onclick="clearImage()">Remove photo</button></div>


<label>What have you collected? <span class="label-hindi">क्या इकट्ठा किया?</span></label>

<select id="material">

<option value="">
Select a material
</option>

<option>PCB</option>
<option>Cable</option>
<option>Battery</option>
<option>LCD</option>
<option>CRT</option>
<option>Motor</option>
<option>Plastic</option>
<option>Mixed E-Waste</option>

</select>

<label>Short description <span class="label-hindi">(optional)</span></label>
<textarea id="description" placeholder="e.g. Mixed cables, old computer parts"></textarea>


<label>Approximate weight (kg)</label>

<input
    type="number"
    id="weight"
    placeholder="e.g. 4.5"
    min="0"
>


<label>Condition</label>

<select id="condition">

<option>Good</option>
<option>Used</option>
<option>Damaged</option>
<option>Mixed</option>

</select>


<label>Collection location</label>

<input
    type="text"
    id="location"
    placeholder="Tap button or enter location manually"
>


<button
    class="primary-btn"
    onclick="getLocation()">

📍 Capture my location

</button>


<button
    class="primary-btn"
    onclick="createLot()">

Create lot & see offers →

</button>


<p class="form-footnote">🔒 Location is used only to find nearby verified recyclers.</p><p id="message"></p>

</div>

</div>


<script>

let detectedCoordinates = null;
let nativeImageDataUrl = null;

function triggerImagePicker() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ImageSelector) {
        window.Capacitor.Plugins.ImageSelector.showImageSelector()
            .then(result => {
                if (result && result.dataUrl) {
                    nativeImageDataUrl = result.dataUrl;
                    document.getElementById("previewImage").src = result.dataUrl;
                    document.getElementById("imagePreview").hidden = false;
                    document.getElementById("message").innerText = "Photo added successfully.";
                }
            })
            .catch(err => {
                console.warn("Native image selector error or cancellation:", err);
                const errMsg = typeof err === 'string' ? err : (err && err.message ? err.message : "");
                if (errMsg.includes("Camera permission denied")) {
                    alert("Camera permission was denied. Please allow camera access in your device settings.");
                    document.getElementById("message").innerText = "Camera permission denied.";
                } else if (errMsg !== "Cancelled") {
                    document.getElementById("message").innerText = "Could not capture image. Please try again.";
                }
            });
    } else {
        document.getElementById("photo").click();
    }
}

document.getElementById("photo").addEventListener("change", function () {
    const file = this.files[0];
    const preview = document.getElementById("imagePreview");
    if (!file) { preview.hidden = true; return; }
    if (!file.type.startsWith("image/")) {
        this.value = "";
        preview.hidden = true;
        document.getElementById("message").innerText = "Please choose an image file.";
        return;
    }
    const reader = new FileReader();
    reader.onload = event => {
        nativeImageDataUrl = null;
        document.getElementById("previewImage").src = event.target.result;
        preview.hidden = false;
        document.getElementById("message").innerText = "Photo ready to add to this lot.";
    };
    reader.readAsDataURL(file);
});

function clearImage() {
    nativeImageDataUrl = null;
    document.getElementById("photo").value = "";
    document.getElementById("previewImage").removeAttribute("src");
    document.getElementById("imagePreview").hidden = true;
}

async function getLocation() {
    const msgEl = document.getElementById("message");
    const locInput = document.getElementById("location");

    msgEl.innerText = "🔍 Detecting location...";

    function handlePositionSuccess(lat, lon) {
        detectedCoordinates = { latitude: lat, longitude: lon };
        locInput.value = lat.toFixed(5) + ", " + lon.toFixed(5);
        msgEl.innerText = "✓ Location detected successfully.";
    }

    function handlePositionError(err) {
        console.warn("Location detection error:", err);
        const errMsg = typeof err === 'string' ? err : (err && err.message ? err.message : "");

        // Handle Location Services Disabled gracefully with manual fallback
        msgEl.innerText = "⚠️ GPS location disabled or unavailable. You can type location manually or use fallback location.";
        locInput.placeholder = "e.g. 18.5204, 73.8567 or Market Yard";

        if (!detectedCoordinates) {
            detectedCoordinates = { latitude: 18.5204, longitude: 73.8567 }; // Default fallback coordinates
            if (!locInput.value) {
                locInput.value = "18.52040, 73.85670";
            }
        }
    }

    // Native Capacitor Geolocation Bridge
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation) {
        const Geolocation = window.Capacitor.Plugins.Geolocation;
        try {
            let permStatus = await Geolocation.checkPermissions();
            if (permStatus.location !== 'granted' && permStatus.coarseLocation !== 'granted') {
                permStatus = await Geolocation.requestPermissions();
            }

            if (permStatus.location === 'granted' || permStatus.coarseLocation === 'granted') {
                const position = await Geolocation.getCurrentPosition({
                    enableHighAccuracy: true,
                    timeout: 8000,
                    maximumAge: 300000
                });
                if (position && position.coords) {
                    handlePositionSuccess(position.coords.latitude, position.coords.longitude);
                    return;
                }
            } else {
                handlePositionError({ code: 1, message: "Location permission denied" });
                return;
            }
        } catch (nativeErr) {
            console.warn("Capacitor Geolocation error, attempting Web fallback:", nativeErr);
            handlePositionError(nativeErr);
            return;
        }
    }

    // Web Geolocation Fallback
    if (!navigator.geolocation) {
        handlePositionError("Web Geolocation not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function (position) {
            handlePositionSuccess(position.coords.latitude, position.coords.longitude);
        },
        function (error) {
            handlePositionError(error);
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
    );
}


window.createLot = function() {

    const material =
        document.getElementById("material").value;

    const weight =
        document.getElementById("weight").value;

    const condition =
        document.getElementById("condition").value;

    const description = document.getElementById("description").value.trim();

    let location =
        document.getElementById("location").value.trim();

    const photoFile =
        document.getElementById("photo").files[0];


    if (!nativeImageDataUrl && !photoFile) {
        alert("Please add an e-waste photo before creating the lot.");
        return;
    }

    if (!material || !weight || Number(weight) <= 0) {
        alert("Please select a material and enter a valid weight.");
        return;
    }

    // Ensure coordinates exist even if GPS was disabled
    if (!location && !detectedCoordinates) {
        location = "18.52040, 73.85670";
        detectedCoordinates = { latitude: 18.5204, longitude: 73.8567 };
    } else if (!detectedCoordinates) {
        detectedCoordinates = { latitude: 18.5204, longitude: 73.8567 };
    }

    const saveLot = async function(image = "") {
        const lot = {
            id: "LOT-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6).toUpperCase(),
            material: material,
            weight: Number(weight),
            condition: condition,
            description: description,
            location: location || "18.52040, 73.85670",
            latitude: detectedCoordinates ? detectedCoordinates.latitude : 18.5204,
            longitude: detectedCoordinates ? detectedCoordinates.longitude : 73.8567,
            image: image,
            photo_path: image,
            createdAt: new Date().toLocaleString(),
            status: "Waiting for Recycler Offers",
            sync_status: "PENDING",
            retry_count: 0,
            server_id: null
        };

        try {
            if (window.EcoNexDB && typeof window.EcoNexDB.saveLot === 'function') {
                await window.EcoNexDB.saveLot(lot);
            } else {
                const lots = JSON.parse(localStorage.getItem("lots")) || [];
                lots.push(lot);
                localStorage.setItem("lots", JSON.stringify(lots));
            }
        } catch (error) {
            console.error("Storage error:", error);
            if (error.name === "QuotaExceededError") {
                alert("Storage is full. Please clear old test lots and try again.");
                return;
            }
        }
        alert("Lot created successfully!\n\nLot ID: " + lot.id);
        window.location.href = "offers.html";
    };

    if (nativeImageDataUrl) {
        saveLot(nativeImageDataUrl);
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            const canvas = document.createElement("canvas");

            const MAX_WIDTH = 800;
            const MAX_HEIGHT = 800;

            let width = img.width;
            let height = img.height;


            // Resize image
            if (width > MAX_WIDTH) {

                height =
                    height * (MAX_WIDTH / width);

                width = MAX_WIDTH;
            }

            if (height > MAX_HEIGHT) {

                width =
                    width * (MAX_HEIGHT / height);

                height = MAX_HEIGHT;
            }


            canvas.width = width;
            canvas.height = height;


            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );


            // Convert to compressed JPEG
            const compressedImage =
                canvas.toDataURL(
                    "image/jpeg",
                    0.6
                );


            saveLot(compressedImage);
        };
        img.onerror = function() { alert("This photo could not be read. Please choose another image."); };
        img.src = event.target.result;
    };


    reader.readAsDataURL(photoFile);
};

</script>

<script src="js/capacitor.js"></script>
<script src="js/network.js"></script>
<script src="js/geolocation.js"></script>
<script src="js/db.js"></script>
<script src="js/sync.js"></script>
<script src="js/sync-engine.js"></script>
<script src="js/i18n.js"></script>
</body>

</html>
