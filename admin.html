<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Verification</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="app-page admin-page">

<script>
    const role = localStorage.getItem("currentRole");
    const email = localStorage.getItem("currentUserEmail");
    if (role !== "admin" || !email || email.toLowerCase() !== "ganeshj2837@gmail.com") {
        alert("Access denied. This Google account is not authorized for Admin Portal.");
        localStorage.removeItem("currentRole");
        localStorage.removeItem("currentUserEmail");
        localStorage.removeItem("currentUserName");
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.GoogleAuth) {
            window.Capacitor.Plugins.GoogleAuth.signOut().catch(() => {});
        }
        window.location.href = "index.html";
    }

    function logoutAdmin() {
        localStorage.removeItem("currentRole");
        localStorage.removeItem("currentUserEmail");
        localStorage.removeItem("currentUserName");
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.GoogleAuth) {
            window.Capacitor.Plugins.GoogleAuth.signOut().catch(() => {});
        }
        window.location.href = "index.html";
    }
</script>

<div class="page">

    <div class="header app-header"><div><a class="brand brand--small" href="index.html"><span class="brand-mark">E</span><span>EcoNex</span></a><p>Admin workspace • recycler verification</p></div><button class="quiet-btn" onclick="logoutAdmin()">Log out</button></div>


    <div class="card form-card">
        <span class="section-kicker">TRUST & COMPLIANCE</span><h2>Recycler verification</h2>
        <p class="form-intro">Review registration details and documents before approving network access.</p>

    </div>


    <!-- Recycler profile appears here -->

    <div id="recyclerContainer"></div>


    <div class="card">

        <h2>
            📜 Verification History
        </h2>


        <div id="historyContainer">

            <p>
                Loading...
            </p>

        </div>

    </div>

</div>


<!-- IMPORTANT -->

<script src="js/admin.js"></script>


<script src="js/i18n.js"></script>
</body>

</html>
